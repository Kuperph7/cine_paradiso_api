openapi: 3.0.3

info:
  title: Cine Paradiso API
  version: 2.0.0
  description: |
    Contrato unificado para autenticación, cartelera, compras, entradas y
    administración. Las rutas representan recursos, no roles. La autorización
    se resuelve con el rol `usuario` o `administrador` incluido en el JWT.

servers:
  - url: http://localhost:5000
    description: Backend Flask local

tags:
  - name: Autenticación
  - name: Cartelera
  - name: Compras
  - name: Entradas
  - name: Películas
  - name: Funciones
  - name: Salas
  - name: Servicios
  - name: Estadísticas

security:
  - bearerAuth: []

paths:
  /auth/registro:
    post:
      tags: [Autenticación]
      operationId: registrarUsuario
      summary: Registrar un usuario
      description: Crea una cuenta con rol `usuario`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
      responses:
        '201':
          description: Usuario registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400': { $ref: '#/components/responses/Error400' }
        '409': { $ref: '#/components/responses/Error409' }

  /auth/login:
    post:
      tags: [Autenticación]
      operationId: iniciarSesion
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales válidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }

  /peliculas:
    get:
      tags: [Cartelera, Películas]
      operationId: listarPeliculas
      summary: Listar películas
      description: |
        El público ve películas activas con funciones publicadas. Un
        administrador puede incluir las inactivas mediante el filtro.
      security:
        - {}
        - bearerAuth: []
      x-roles: [publico, usuario, administrador]
      parameters:
        - name: incluir_inactivas
          in: query
          required: false
          description: Filtro exclusivo del rol `administrador`.
          schema: { type: boolean, default: false }
        - name: titulo
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Películas listadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeliculasLista' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
    post:
      tags: [Películas]
      operationId: crearPelicula
      summary: Crear una película
      description: Requiere rol `administrador`.
      x-roles: [administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeliculaCreate' }
      responses:
        '201':
          description: Película creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pelicula' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '409': { $ref: '#/components/responses/Error409' }

  /peliculas/externas:
    get:
      tags: [Películas]
      operationId: buscarPeliculasExternas
      summary: Buscar películas en el catálogo externo
      description: Requiere rol `administrador`.
      x-roles: [administrador]
      parameters:
        - name: titulo
          in: query
          required: true
          schema: { type: string, minLength: 1 }
          example: El padrino
      responses:
        '200':
          description: Resultados encontrados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeliculasExternasLista' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }

  /peliculas/{pelicula_id}:
    get:
      tags: [Cartelera, Películas]
      operationId: obtenerPelicula
      summary: Obtener una película
      description: El administrador también puede consultar películas inactivas.
      security:
        - {}
        - bearerAuth: []
      x-roles: [publico, usuario, administrador]
      parameters:
        - $ref: '#/components/parameters/PeliculaId'
      responses:
        '200':
          description: Película encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pelicula' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }
    patch:
      tags: [Películas]
      operationId: actualizarPelicula
      summary: Modificar o desactivar una película
      description: Requiere rol `administrador`. La baja se indica con `activa=false`.
      x-roles: [administrador]
      parameters:
        - $ref: '#/components/parameters/PeliculaId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeliculaUpdate' }
      responses:
        '200':
          description: Película actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pelicula' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }

  /funciones:
    get:
      tags: [Cartelera, Funciones]
      operationId: listarFunciones
      summary: Listar funciones
      description: |
        El público ve funciones programadas y publicadas. Un administrador
        puede filtrar por cualquier estado usando la misma ruta.
      security:
        - {}
        - bearerAuth: []
      x-roles: [publico, usuario, administrador]
      parameters:
        - name: pelicula_id
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: desde
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: hasta
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: estado
          in: query
          required: false
          description: Filtro exclusivo del rol `administrador`.
          schema: { $ref: '#/components/schemas/EstadoFuncion' }
      responses:
        '200':
          description: Funciones listadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FuncionesLista' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
    post:
      tags: [Funciones]
      operationId: crearFuncion
      summary: Programar una función
      description: Requiere rol `administrador`.
      x-roles: [administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FuncionCreate' }
      responses:
        '201':
          description: Función creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Funcion' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }

  /funciones/{funcion_id}:
    get:
      tags: [Cartelera, Funciones]
      operationId: obtenerFuncion
      summary: Obtener una función
      description: El administrador también puede consultar funciones no publicadas.
      security:
        - {}
        - bearerAuth: []
      x-roles: [publico, usuario, administrador]
      parameters:
        - $ref: '#/components/parameters/FuncionId'
      responses:
        '200':
          description: Función encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Funcion' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }
    patch:
      tags: [Funciones]
      operationId: actualizarFuncion
      summary: Modificar, publicar o cancelar una función
      description: Requiere rol `administrador`.
      x-roles: [administrador]
      parameters:
        - $ref: '#/components/parameters/FuncionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FuncionUpdate' }
      responses:
        '200':
          description: Función actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Funcion' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }

  /funciones/{funcion_id}/butacas:
    get:
      tags: [Cartelera]
      operationId: listarButacasFuncion
      summary: Consultar disponibilidad de butacas
      security: []
      parameters:
        - $ref: '#/components/parameters/FuncionId'
      responses:
        '200':
          description: Disponibilidad de la función
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ButacasFuncionLista' }
        '404': { $ref: '#/components/responses/Error404' }

  /salas:
    get:
      tags: [Salas]
      operationId: listarSalas
      summary: Listar salas
      description: Requiere rol `administrador`.
      x-roles: [administrador]
      parameters:
        - name: incluir_inactivas
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Salas listadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalasLista' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
    post:
      tags: [Salas]
      operationId: crearSala
      summary: Crear una sala
      description: Requiere rol `administrador`.
      x-roles: [administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalaCreate' }
      responses:
        '201':
          description: Sala creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sala' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }

  /salas/{sala_id}:
    get:
      tags: [Salas]
      operationId: obtenerSala
      summary: Obtener una sala
      description: Requiere rol `administrador`.
      x-roles: [administrador]
      parameters:
        - $ref: '#/components/parameters/SalaId'
      responses:
        '200':
          description: Sala encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sala' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
    patch:
      tags: [Salas]
      operationId: actualizarSala
      summary: Modificar o desactivar una sala
      description: Requiere rol `administrador`.
      x-roles: [administrador]
      parameters:
        - $ref: '#/components/parameters/SalaId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalaUpdate' }
      responses:
        '200':
          description: Sala actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sala' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }

  /servicios:
    get:
      tags: [Servicios]
      operationId: listarServicios
      summary: Listar servicios adicionales
      description: |
        El público ve servicios activos. Un administrador puede incluir los
        inactivos mediante el filtro usando la misma ruta.
      security:
        - {}
        - bearerAuth: []
      x-roles: [publico, usuario, administrador]
      parameters:
        - name: incluir_inactivos
          in: query
          required: false
          description: Filtro exclusivo del rol `administrador`.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Servicios listados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiciosLista' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
    post:
      tags: [Servicios]
      operationId: crearServicio
      summary: Crear un servicio
      description: Requiere rol `administrador`.
      x-roles: [administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicioCreate' }
      responses:
        '201':
          description: Servicio creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Servicio' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '409': { $ref: '#/components/responses/Error409' }

  /servicios/{servicio_id}:
    get:
      tags: [Servicios]
      operationId: obtenerServicio
      summary: Obtener un servicio
      description: El administrador también puede consultar servicios inactivos.
      security:
        - {}
        - bearerAuth: []
      x-roles: [publico, usuario, administrador]
      parameters:
        - $ref: '#/components/parameters/ServicioId'
      responses:
        '200':
          description: Servicio encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Servicio' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }
    patch:
      tags: [Servicios]
      operationId: actualizarServicio
      summary: Modificar un servicio
      description: Requiere rol `administrador`.
      x-roles: [administrador]
      parameters:
        - $ref: '#/components/parameters/ServicioId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicioUpdate' }
      responses:
        '200':
          description: Servicio actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Servicio' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
    delete:
      tags: [Servicios]
      operationId: eliminarServicio
      summary: Desactivar un servicio
      description: Requiere rol `administrador`. La baja es lógica.
      x-roles: [administrador]
      parameters:
        - $ref: '#/components/parameters/ServicioId'
      responses:
        '204': { description: Servicio desactivado }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }

  /compras:
    get:
      tags: [Compras]
      operationId: listarCompras
      summary: Listar compras
      description: |
        Un usuario obtiene sus compras. Un administrador obtiene todas y puede
        filtrar por `usuario_id`.
      x-roles: [usuario, administrador]
      parameters:
        - name: usuario_id
          in: query
          required: false
          description: Filtro exclusivo del rol `administrador`.
          schema: { type: integer, minimum: 1 }
        - name: estado
          in: query
          required: false
          schema: { $ref: '#/components/schemas/EstadoCompra' }
      responses:
        '200':
          description: Compras listadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComprasLista' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
    post:
      tags: [Compras]
      operationId: crearCompra
      summary: Comprar entradas y servicios
      description: |
        Reserva las butacas, agrega los servicios seleccionados, calcula los
        importes con precios vigentes y genera una entrada por butaca. Toda la
        operación es atómica.
      x-roles: [usuario, administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompraCreate' }
            example:
              funcion_id: 3
              butaca_ids: [17, 18]
              servicios:
                - servicio_id: 4
                  cantidad: 2
              medio_pago: tarjeta
      responses:
        '201':
          description: Compra confirmada y entradas generadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Compra' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }

  /compras/{compra_id}:
    get:
      tags: [Compras]
      operationId: obtenerCompra
      summary: Obtener una compra
      description: El usuario accede a compras propias; el administrador, a cualquiera.
      x-roles: [usuario, administrador]
      parameters:
        - $ref: '#/components/parameters/CompraId'
      responses:
        '200':
          description: Compra encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Compra' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
    patch:
      tags: [Compras]
      operationId: cancelarCompra
      summary: Cancelar una compra
      description: |
        El usuario cancela compras propias dentro del plazo permitido. El
        administrador puede cancelar cualquiera. Se anulan las entradas y se
        liberan las butacas en la misma transacción.
      x-roles: [usuario, administrador]
      parameters:
        - $ref: '#/components/parameters/CompraId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompraUpdate' }
      responses:
        '200':
          description: Compra cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Compra' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }

  /entradas:
    get:
      tags: [Entradas]
      operationId: listarEntradas
      summary: Listar entradas
      description: |
        Un usuario obtiene sus entradas. Un administrador obtiene todas y puede
        aplicar los filtros disponibles.
      x-roles: [usuario, administrador]
      parameters:
        - name: usuario_id
          in: query
          required: false
          description: Filtro exclusivo del rol `administrador`.
          schema: { type: integer, minimum: 1 }
        - name: funcion_id
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: estado
          in: query
          required: false
          schema: { $ref: '#/components/schemas/EstadoEntrada' }
      responses:
        '200':
          description: Entradas listadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntradasLista' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }

  /entradas/validar:
    post:
      tags: [Entradas]
      operationId: validarEntrada
      summary: Validar una entrada y marcarla como utilizada
      description: Requiere rol `administrador`. La operación es atómica.
      x-roles: [administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidarEntradaRequest' }
      responses:
        '200':
          description: Entrada validada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entrada' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }

  /entradas/{entrada_id}:
    get:
      tags: [Entradas]
      operationId: obtenerEntrada
      summary: Obtener una entrada
      description: El usuario accede a entradas propias; el administrador, a cualquiera.
      x-roles: [usuario, administrador]
      parameters:
        - $ref: '#/components/parameters/EntradaId'
      responses:
        '200':
          description: Entrada encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entrada' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }

  /estadisticas:
    get:
      tags: [Estadísticas]
      operationId: obtenerEstadisticas
      summary: Consultar estadísticas de ventas y ocupación
      description: Requiere rol `administrador`.
      x-roles: [administrador]
      parameters:
        - name: desde
          in: query
          required: false
          description: Debe enviarse junto con `hasta`.
          schema: { type: string, format: date-time }
          example: '2026-11-01T00:00:00-03:00'
        - name: hasta
          in: query
          required: false
          description: Debe enviarse junto con `desde`.
          schema: { type: string, format: date-time }
          example: '2026-11-30T23:59:59-03:00'
      responses:
        '200':
          description: Estadísticas calculadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estadisticas' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de `/auth/login` con rol `usuario` o `administrador`.

  parameters:
    PeliculaId:
      name: pelicula_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
      example: 1
    FuncionId:
      name: funcion_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
      example: 3
    SalaId:
      name: sala_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
      example: 2
    ServicioId:
      name: servicio_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
      example: 4
    CompraId:
      name: compra_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
      example: 25
    EntradaId:
      name: entrada_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
      example: 99

  responses:
    Error400:
      description: Solicitud inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error401:
      description: Token ausente o inválido, o credenciales incorrectas
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error403:
      description: El usuario no tiene permiso para la operación
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error404:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error409:
      description: Conflicto con el estado del recurso o una regla de negocio
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Rol:
      type: string
      enum: [usuario, administrador]
      example: usuario

    Usuario:
      type: object
      required: [id, nombre, email, rol]
      properties:
        id: { type: integer, minimum: 1, example: 7 }
        nombre: { type: string, example: Ana Pérez }
        email: { type: string, format: email, example: ana@example.com }
        rol: { $ref: '#/components/schemas/Rol' }

    RegistroRequest:
      type: object
      additionalProperties: false
      required: [nombre, email, password]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 120, example: Ana Pérez }
        email: { type: string, format: email, example: ana@example.com }
        password:
          type: string
          format: password
          minLength: 8
          writeOnly: true
          example: clave-segura-123

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, example: ana@example.com }
        password: { type: string, format: password, writeOnly: true, example: clave-segura-123 }

    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in, usuario]
      properties:
        access_token: { type: string, readOnly: true, example: eyJhbGciOiJIUzI1NiJ9... }
        token_type: { type: string, enum: [Bearer], example: Bearer }
        expires_in: { type: integer, minimum: 1, example: 3600 }
        usuario: { $ref: '#/components/schemas/Usuario' }

    PeliculaExterna:
      type: object
      required: [id_externo, titulo]
      properties:
        id_externo: { type: integer, example: 238 }
        titulo: { type: string, example: El padrino }
        sinopsis: { type: string, nullable: true, example: Historia de una familia mafiosa. }
        poster_url: { type: string, format: uri, nullable: true, example: 'https://image.tmdb.org/t/p/w500/ejemplo.jpg' }

    Pelicula:
      type: object
      required: [id, titulo, sinopsis, poster_url, duracion_minutos, clasificacion, genero, activa]
      properties:
        id: { type: integer, minimum: 1, example: 1 }
        id_externo: { type: integer, nullable: true, example: 238 }
        titulo: { type: string, example: El padrino }
        sinopsis: { type: string, example: Historia de una familia mafiosa. }
        poster_url: { type: string, format: uri, example: 'https://image.tmdb.org/t/p/w500/ejemplo.jpg' }
        duracion_minutos: { type: integer, minimum: 1, example: 175 }
        clasificacion: { type: string, example: '+16' }
        genero: { type: string, example: Drama }
        activa: { type: boolean, example: true }

    PeliculaCreate:
      type: object
      additionalProperties: false
      required: [titulo, sinopsis, poster_url, duracion_minutos, clasificacion, genero]
      properties:
        id_externo: { type: integer, example: 238 }
        titulo: { type: string, minLength: 1, example: El padrino }
        sinopsis: { type: string, minLength: 1, example: Historia de una familia mafiosa. }
        poster_url: { type: string, format: uri, example: 'https://image.tmdb.org/t/p/w500/ejemplo.jpg' }
        duracion_minutos: { type: integer, minimum: 1, example: 175 }
        clasificacion: { type: string, minLength: 1, example: '+16' }
        genero: { type: string, minLength: 1, example: Drama }

    PeliculaUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        titulo: { type: string, minLength: 1 }
        sinopsis: { type: string, minLength: 1 }
        poster_url: { type: string, format: uri }
        duracion_minutos: { type: integer, minimum: 1 }
        clasificacion: { type: string, minLength: 1 }
        genero: { type: string, minLength: 1 }
        activa: { type: boolean }

    PeliculasExternasLista:
      type: object
      required: [peliculas]
      properties:
        peliculas:
          type: array
          items: { $ref: '#/components/schemas/PeliculaExterna' }

    PeliculasLista:
      type: object
      required: [peliculas]
      properties:
        peliculas:
          type: array
          items: { $ref: '#/components/schemas/Pelicula' }

    EstadoFuncion:
      type: string
      enum: [programada, cancelada]
      example: programada

    Funcion:
      type: object
      required: [id, pelicula_id, sala_id, fecha_hora, precio, estado]
      properties:
        id: { type: integer, minimum: 1, example: 3 }
        pelicula_id: { type: integer, minimum: 1, example: 1 }
        sala_id: { type: integer, minimum: 1, example: 2 }
        fecha_hora: { type: string, format: date-time, example: '2026-11-15T20:30:00-03:00' }
        precio:
          type: integer
          minimum: 0
          description: Precio de una entrada en pesos argentinos enteros.
          example: 5000
        estado: { $ref: '#/components/schemas/EstadoFuncion' }

    FuncionCreate:
      type: object
      additionalProperties: false
      required: [pelicula_id, sala_id, fecha_hora, precio]
      properties:
        pelicula_id: { type: integer, minimum: 1, example: 1 }
        sala_id: { type: integer, minimum: 1, example: 2 }
        fecha_hora: { type: string, format: date-time, example: '2026-11-15T20:30:00-03:00' }
        precio: { type: integer, minimum: 0, description: Pesos argentinos enteros., example: 5000 }
        estado:
          allOf:
            - $ref: '#/components/schemas/EstadoFuncion'
          default: programada

    FuncionUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        pelicula_id: { type: integer, minimum: 1 }
        sala_id: { type: integer, minimum: 1 }
        fecha_hora: { type: string, format: date-time }
        precio: { type: integer, minimum: 0, description: Pesos argentinos enteros. }
        estado: { $ref: '#/components/schemas/EstadoFuncion' }

    FuncionesLista:
      type: object
      required: [funciones]
      properties:
        funciones:
          type: array
          items: { $ref: '#/components/schemas/Funcion' }

    Sala:
      type: object
      required: [id, local_id, nombre, filas, butacas_por_fila, capacidad, activa]
      properties:
        id: { type: integer, minimum: 1, example: 2 }
        local_id: { type: integer, minimum: 1, example: 1 }
        nombre: { type: string, example: Sala 2 }
        filas: { type: integer, minimum: 1, example: 8 }
        butacas_por_fila: { type: integer, minimum: 1, example: 10 }
        capacidad: { type: integer, minimum: 1, readOnly: true, example: 80 }
        activa: { type: boolean, example: true }

    SalaCreate:
      type: object
      additionalProperties: false
      required: [local_id, nombre, filas, butacas_por_fila]
      properties:
        local_id: { type: integer, minimum: 1, example: 1 }
        nombre: { type: string, minLength: 1, example: Sala 2 }
        filas: { type: integer, minimum: 1, example: 8 }
        butacas_por_fila: { type: integer, minimum: 1, example: 10 }

    SalaUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nombre: { type: string, minLength: 1 }
        filas: { type: integer, minimum: 1 }
        butacas_por_fila: { type: integer, minimum: 1 }
        activa: { type: boolean }

    SalasLista:
      type: object
      required: [salas]
      properties:
        salas:
          type: array
          items: { $ref: '#/components/schemas/Sala' }

    EstadoButaca:
      type: string
      enum: [disponible, ocupada]
      example: disponible

    ButacaFuncion:
      type: object
      required: [id, fila, numero, estado]
      properties:
        id: { type: integer, minimum: 1, example: 17 }
        fila: { type: string, example: B }
        numero: { type: integer, minimum: 1, example: 7 }
        estado: { $ref: '#/components/schemas/EstadoButaca' }

    ButacasFuncionLista:
      type: object
      required: [funcion_id, butacas]
      properties:
        funcion_id: { type: integer, minimum: 1, example: 3 }
        butacas:
          type: array
          items: { $ref: '#/components/schemas/ButacaFuncion' }

    Servicio:
      type: object
      required: [id, nombre, descripcion, precio, activo]
      properties:
        id: { type: integer, minimum: 1, example: 4 }
        nombre: { type: string, example: Combo pochoclos }
        descripcion: { type: string, example: Pochoclos y gaseosa }
        precio: { type: integer, minimum: 0, description: Pesos argentinos enteros., example: 4500 }
        activo: { type: boolean, example: true }

    ServicioCreate:
      type: object
      additionalProperties: false
      required: [nombre, precio]
      properties:
        nombre: { type: string, minLength: 1, example: Combo pochoclos }
        descripcion: { type: string, minLength: 1, example: Pochoclos y gaseosa }
        precio: { type: integer, minimum: 0, description: Pesos argentinos enteros., example: 4500 }

    ServicioUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nombre: { type: string, minLength: 1 }
        descripcion: { type: string, minLength: 1 }
        precio: { type: integer, minimum: 0, description: Pesos argentinos enteros. }
        activo: { type: boolean }

    ServiciosLista:
      type: object
      required: [servicios]
      properties:
        servicios:
          type: array
          items: { $ref: '#/components/schemas/Servicio' }

    ServicioSeleccionado:
      type: object
      additionalProperties: false
      required: [servicio_id, cantidad]
      properties:
        servicio_id: { type: integer, minimum: 1, example: 4 }
        cantidad: { type: integer, minimum: 1, example: 2 }

    MedioPago:
      type: string
      enum: [tarjeta, efectivo, transferencia]
      example: tarjeta

    EstadoCompra:
      type: string
      enum: [confirmada, cancelada]
      example: confirmada

    CompraCreate:
      type: object
      additionalProperties: false
      required: [funcion_id, butaca_ids, medio_pago]
      properties:
        funcion_id: { type: integer, minimum: 1, example: 3 }
        butaca_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, minimum: 1 }
          example: [17, 18]
        servicios:
          type: array
          default: []
          uniqueItems: true
          description: Una entrada por servicio adicional seleccionado; no se repiten identificadores.
          items: { $ref: '#/components/schemas/ServicioSeleccionado' }
        medio_pago: { $ref: '#/components/schemas/MedioPago' }

    CompraUpdate:
      type: object
      additionalProperties: false
      required: [estado]
      properties:
        estado: { type: string, enum: [cancelada], example: cancelada }
        motivo: { type: string, maxLength: 500, example: No podré asistir. }

    CompraServicio:
      type: object
      required: [servicio_id, nombre, cantidad, precio_unitario, subtotal]
      properties:
        servicio_id: { type: integer, minimum: 1, example: 4 }
        nombre: { type: string, example: Combo pochoclos }
        cantidad: { type: integer, minimum: 1, example: 2 }
        precio_unitario: { type: integer, minimum: 0, description: Pesos argentinos enteros., example: 4500 }
        subtotal: { type: integer, minimum: 0, description: Pesos argentinos enteros., example: 9000 }

    Compra:
      type: object
      required: [id, usuario_id, funcion_id, estado, medio_pago, fecha_hora, total_entradas, total_servicios, total, servicios, entradas]
      properties:
        id: { type: integer, minimum: 1, example: 25 }
        usuario_id: { type: integer, minimum: 1, example: 7 }
        funcion_id: { type: integer, minimum: 1, example: 3 }
        estado: { $ref: '#/components/schemas/EstadoCompra' }
        medio_pago: { $ref: '#/components/schemas/MedioPago' }
        fecha_hora: { type: string, format: date-time, example: '2026-11-02T15:30:00-03:00' }
        total_entradas: { type: integer, minimum: 0, description: Pesos argentinos enteros., example: 10000 }
        total_servicios: { type: integer, minimum: 0, description: Pesos argentinos enteros., example: 9000 }
        total: { type: integer, minimum: 0, description: Pesos argentinos enteros., example: 19000 }
        servicios:
          type: array
          items: { $ref: '#/components/schemas/CompraServicio' }
        entradas:
          type: array
          items: { $ref: '#/components/schemas/Entrada' }

    ComprasLista:
      type: object
      required: [compras]
      properties:
        compras:
          type: array
          items: { $ref: '#/components/schemas/Compra' }

    EstadoEntrada:
      type: string
      enum: [vigente, utilizada, cancelada]
      example: vigente

    Entrada:
      type: object
      required: [id, compra_id, usuario_id, funcion_id, butaca, codigo_qr, estado]
      properties:
        id: { type: integer, minimum: 1, example: 99 }
        compra_id: { type: integer, minimum: 1, example: 25 }
        usuario_id: { type: integer, minimum: 1, example: 7 }
        funcion_id: { type: integer, minimum: 1, example: 3 }
        butaca: { $ref: '#/components/schemas/ButacaFuncion' }
        codigo_qr:
          type: string
          readOnly: true
          description: Token opaco único, sin datos personales.
          example: QRCINE-8e6f11
        estado: { $ref: '#/components/schemas/EstadoEntrada' }
        utilizada_en:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          example: '2026-11-15T20:25:00-03:00'

    EntradasLista:
      type: object
      required: [entradas]
      properties:
        entradas:
          type: array
          items: { $ref: '#/components/schemas/Entrada' }

    ValidarEntradaRequest:
      type: object
      additionalProperties: false
      required: [codigo_qr, funcion_id]
      properties:
        codigo_qr: { type: string, minLength: 1, example: QRCINE-8e6f11 }
        funcion_id: { type: integer, minimum: 1, example: 3 }

    OcupacionFuncion:
      type: object
      required: [funcion_id, butacas_vendidas, capacidad, porcentaje]
      properties:
        funcion_id: { type: integer, minimum: 1, example: 3 }
        butacas_vendidas: { type: integer, minimum: 0, example: 45 }
        capacidad: { type: integer, minimum: 1, example: 80 }
        porcentaje: { type: number, format: float, minimum: 0, maximum: 100, example: 56.25 }

    OcupacionPelicula:
      type: object
      required: [pelicula_id, butacas_vendidas, capacidad_total_funciones, porcentaje]
      properties:
        pelicula_id: { type: integer, minimum: 1, example: 1 }
        butacas_vendidas: { type: integer, minimum: 0, example: 125 }
        capacidad_total_funciones: { type: integer, minimum: 0, example: 240 }
        porcentaje: { type: number, format: float, minimum: 0, maximum: 100, example: 52.08 }

    VentasGenero:
      type: object
      required: [genero, total_ventas]
      properties:
        genero: { type: string, example: Drama }
        total_ventas: { type: integer, minimum: 0, description: Pesos argentinos enteros., example: 200000 }

    VentasFranja:
      type: object
      required: [franja, entradas_vendidas]
      properties:
        franja: { type: string, example: '18:00-21:00' }
        entradas_vendidas: { type: integer, minimum: 0, example: 72 }

    Estadisticas:
      type: object
      required: [ocupacion_por_funcion, ocupacion_por_pelicula, ventas_por_genero, franjas_horarias, cancelaciones]
      properties:
        ocupacion_por_funcion:
          type: array
          items: { $ref: '#/components/schemas/OcupacionFuncion' }
        ocupacion_por_pelicula:
          type: array
          items: { $ref: '#/components/schemas/OcupacionPelicula' }
        ventas_por_genero:
          type: array
          items: { $ref: '#/components/schemas/VentasGenero' }
        franjas_horarias:
          type: array
          items: { $ref: '#/components/schemas/VentasFranja' }
        cancelaciones: { type: integer, minimum: 0, example: 12 }

    ErrorDetalle:
      type: object
      required: [campo, mensaje]
      properties:
        campo: { type: string, example: butaca_ids }
        mensaje: { type: string, example: Una de las butacas ya está ocupada. }

    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo: { type: string, example: CONFLICTO_BUTACA }
        mensaje: { type: string, example: No fue posible completar la operación. }
        detalles:
          type: array
          items: { $ref: '#/components/schemas/ErrorDetalle' }
